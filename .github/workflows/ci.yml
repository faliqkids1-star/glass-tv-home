name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Sign APK with a throwaway key
        run: |
          cd launcher/app/build/outputs/apk/release
          ls -la
          keytool -genkeypair -keystore k.jks -storepass glasstv123 -keypass glasstv123 -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GlassTV"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks k.jks --ks-pass pass:glasstv123 --key-pass pass:glasstv123 --out glass-tv-signed.apk app-release*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-apk
          path: launcher/app/build/outputs/apk/release/glass-tv-signed.apk
